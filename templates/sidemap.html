<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sidemap</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; }
  #bar h1 { font-size: 18px; margin: 0; }
  #status { opacity: .7; font-size: 13px; }
  #bar button { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar select { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 4px 8px; max-width: 280px; }
  #bar .hint { opacity: .5; font-size: 12px; }
  canvas { display: block; width: 100vw; height: calc(100vh - 45px); background: #1a1a1a; cursor: grab; }
  #pick { margin: 12px; }
  #drawer { position: fixed; top: 45px; right: 0; bottom: 0; width: 460px; max-width: 90vw; background: #161616; border-left: 1px solid #333; overflow-y: auto; padding: 12px 14px; font-size: 13px; }
  #drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  #drawer-title { font-weight: bold; word-break: break-all; }
  #drawer-x { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  #drawer details { border: 1px solid #333; border-radius: 6px; margin: 8px 0; padding: 6px 8px; }
  #drawer summary { cursor: pointer; word-break: break-all; }
  #drawer h4 { margin: 10px 0 4px; font-size: 12px; opacity: .6; }
  #drawer pre { background: #0d0d0d; padding: 8px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 0; font-size: 12px; }
</style>
</head>
<body>
<div id="bar">
  <h1>sidemap</h1>
  <button id="fit">fit</button>
  <select id="f-endpoint" title="show only pages calling this endpoint"><option value="">endpoint: all</option></select>
  <select id="f-auth" title="pages by wallet need">
    <option value="">auth: all</option>
    <option value="public">public</option>
    <option value="wallet">needs wallet</option>
  </select>
  <span id="status">loading sidemap.json…</span>
  <span class="hint">drag node: move · drag background: pan · wheel: zoom · click node: HTTP calls + trace path · esc: clear</span>
</div>
<aside id="drawer" hidden>
  <div id="drawer-head"><span id="drawer-title"></span><button id="drawer-x">×</button></div>
  <div id="drawer-body"></div>
</aside>
<input id="pick" type="file" accept="application/json" hidden>
<canvas id="c"></canvas>
<script src="./sidemap-data.js"></script>
<script>
const W = 280, IH = 175, LH = 30, GX = 170, GY = 80, PAD = 80;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const status = (m) => (document.getElementById("status").textContent = m);
let G = null, pos = new Map(), idToUrl = new Map(), colOf = new Map(), imgs = new Map();
let ghostCount = 0;
let cam = { x: 0, y: 0, k: 1 };
let sel = []; // [fromUrl, toUrl?]
let hlNodes = null, hlEdges = null;
let fEndpoint = "", fAuth = "";
const byUrl = () => new Map(G.nodes.map((n) => [n.url, n]));

const epKey = (c) => {
  try {
    const u = new URL(c.url);
    return `${c.method} ${u.pathname}`;
  } catch { return `${c.method} ${c.url}`; }
};

function passes(u) {
  if (fEndpoint) {
    const n = byUrl().get(u);
    if (!(n && (n.http || []).some((c) => epKey(c) === fEndpoint))) return false;
  }
  if (fAuth) {
    const n = byUrl().get(u);
    const gated = n && (n.auth || []).length > 0;
    if ((fAuth === "wallet") !== gated) return false;
  }
  return true;
}

function filtersActive() { return fEndpoint !== "" || fAuth !== ""; }

function applyFilters() {
  sel = []; hlNodes = null; hlEdges = null; // filters replace tracing
  const shown = new Set([...idToUrl.values()].filter(passes));
  status(filtersActive() ? `${shown.size}/${new Set(idToUrl.values()).size} shown` : `${G.nodes.length} nodes (+${ghostCount} repeats), ${(G.edges || []).length} edges`);
  draw();
}

async function load() {
  if (window.GRAPH) return window.GRAPH; // written by shoot.ts, works on file://
  for (const p of ["../../../sidemap.json", "./sidemap.json", "/sidemap.json"]) {
    try {
      const r = await fetch(p);
      if (r.ok) return await r.json();
    } catch { /* file:// blocks fetch */ }
  }
  return null;
}

function layout(g) {
  // directed layers from the entry node; every edge flows left-to-right.
  // A backward edge (target at same/earlier layer) repeats its target as a
  // ghost node in a column to the right — paths, never reverse arrows.
  const out = new Map(g.nodes.map((n) => [n.url, []]));
  for (const e of g.edges || []) {
    if (!out.has(e.from) || !out.has(e.to) || e.from === e.to) continue;
    out.get(e.from).push(e.to);
  }
  const depth = new Map([[g.nodes[0].url, 0]]);
  const q = [g.nodes[0].url];
  while (q.length) {
    const u = q.shift();
    for (const v of out.get(u)) {
      if (depth.has(v)) continue;
      depth.set(v, depth.get(u) + 1);
      q.push(v);
    }
  }
  let max = Math.max(0, ...depth.values());
  for (const n of g.nodes) if (!depth.has(n.url)) depth.set(n.url, ++max);
  const entries = g.nodes.map((n) => ({ id: n.url, url: n.url, d: depth.get(n.url) }));
  const seenGhost = new Set();
  for (const e of g.edges || []) {
    const du = depth.get(e.from), dv = depth.get(e.to);
    if (du === undefined || dv === undefined || e.from === e.to || dv > du) continue;
    const gid = `${e.to}@${du + 1}`;
    if (!seenGhost.has(gid)) {
      seenGhost.add(gid);
      entries.push({ id: gid, url: e.to, d: du + 1 });
    }
  }
  ghostCount = seenGhost.size;
  const byD = new Map();
  for (const en of entries) {
    if (!byD.has(en.d)) byD.set(en.d, []);
    byD.get(en.d).push(en);
  }
  const p = new Map();
  idToUrl = new Map();
  colOf = new Map();
  // chunk tall columns so the graph stays wide, not a thin tall strip
  const PER = 5;
  let ci = 0;
  for (const [, list] of [...byD].sort((a, b) => a[0] - b[0])) {
    list.sort((a, b) => (a.url < b.url ? -1 : a.url > b.url ? 1 : 0));
    for (let i = 0; i < list.length; i += PER, ci++)
      list.slice(i, i + PER).forEach((en, j) => {
        p.set(en.id, { x: PAD + ci * (W + GX), y: PAD + j * (IH + LH + GY), ci });
        idToUrl.set(en.id, en.url);
        colOf.set(en.id, ci);
      });
  }
  return p;
}

// leftmost instance of url, optionally strictly right of a column
function instOf(url, afterCi = -1) {
  let best = null;
  for (const [id, p] of pos) {
    if (idToUrl.get(id) !== url || colOf.get(id) <= afterCi) continue;
    if (!best || colOf.get(id) < colOf.get(best)) best = id;
  }
  return best;
}

function bounds() {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (const { x, y } of pos.values()) {
    x1 = Math.min(x1, x); y1 = Math.min(y1, y);
    x2 = Math.max(x2, x + W); y2 = Math.max(y2, y + IH + LH);
  }
  return { x1, y1, x2, y2 };
}

function fit() {
  const b = bounds(), r = cv.getBoundingClientRect();
  cam.k = Math.min(r.width / (b.x2 - b.x1 + PAD), r.height / (b.y2 - b.y1 + PAD), 1.5);
  cam.x = (r.width - (b.x2 - b.x1) * cam.k) / 2 - b.x1 * cam.k;
  cam.y = (r.height - (b.y2 - b.y1) * cam.k) / 2 - b.y1 * cam.k;
  draw();
}

function resize() {
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  draw();
}

const toWorld = (mx, my) => {
  const r = cv.getBoundingClientRect();
  return { x: (mx - r.left - cam.x) / cam.k, y: (my - r.top - cam.y) / cam.k };
};

function nodeAt(wx, wy) {
  for (const [u, { x, y }] of [...pos].reverse())
    if (wx >= x && wx <= x + W && wy >= y && wy <= y + IH + LH) return u;
  return null;
}

function edgeKey(e) { return e.from + "->" + e.to; }

const drawer = document.getElementById("drawer");
const drawerTitle = document.getElementById("drawer-title");
const drawerBody = document.getElementById("drawer-body");
const escHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtBody = (s) => {
  if (!s) return "<i>—</i>";
  const trunc = s.match(/\n…\[truncated \d+ chars\]$|…\[truncated\]$/);
  const core = trunc ? s.slice(0, -trunc[0].length) : s;
  const tail = trunc ? escHtml(trunc[0]) : "";
  try { return escHtml(JSON.stringify(JSON.parse(core), null, 2)) + tail; }
  catch {
    // truncated JSON is no longer parseable: unescape so \n \" \\ read naturally
    return escHtml(core.replace(/\\n/g, "\n").replace(/\\t/g, "\t").replace(/\\"/g, '"').replace(/\\\\/g, "\\")) + tail;
  }
};
const fmtObj = (o) => {
  const keys = o ? Object.keys(o) : [];
  return keys.length ? escHtml(JSON.stringify(o, null, 2)) : "<i>—</i>";
};

function showCalls(u) {
  const n = G.nodes.find((n) => n.url === u);
  drawerTitle.textContent = u;
  const calls = (n && n.http) || [];
  drawerBody.innerHTML = calls.length ? calls.map((c, i) => {
    let short = c.url;
    try { const uu = new URL(c.url); short = uu.pathname + uu.search; } catch { /* keep full */ }
    const ok = c.status >= 200 && c.status < 300;
    return `<details${i === 0 ? " open" : ""}><summary><b>${escHtml(c.method)}</b> ${escHtml(short)} <span style="color:${ok ? "#4c9" : "#f66"}">${c.status}</span></summary>`
      + `<h4>request headers</h4><pre>${fmtObj(c.reqHeaders)}</pre>`
      + `<h4>cookies sent</h4><pre>${fmtObj(c.cookies)}</pre>`
      + `<h4>request body</h4><pre>${fmtBody(c.reqBody)}</pre>`
      + `<h4>response headers</h4><pre>${fmtObj(c.resHeaders)}</pre>`
      + `<h4>set-cookie</h4><pre>${(c.setCookies && c.setCookies.length) ? escHtml(c.setCookies.join("\n")) : "<i>—</i>"}</pre>`
      + `<h4>response body</h4><pre>${fmtBody(c.resBody)}</pre></details>`;
  }).join("") : "<p>no recorded calls</p>";
  drawer.hidden = false;
}

function hideCalls() { drawer.hidden = true; }
document.getElementById("drawer-x").onclick = () => hideCalls();

function trace(a, b) {
  const adj = new Map(G.nodes.map((n) => [n.url, []]));
  for (const e of G.edges || []) if (adj.has(e.from)) adj.get(e.from).push(e.to);
  const prev = new Map([[a, null]]), qq = [a];
  while (qq.length) {
    const u = qq.shift();
    if (u === b) break;
    for (const v of adj.get(u) || [])
      if (!prev.has(v)) { prev.set(v, u); qq.push(v); }
  }
  if (!prev.has(b)) { hlNodes = null; hlEdges = null; status(`no path ${a} → ${b}`); return; }
  const path = [];
  for (let c = b; c; c = prev.get(c)) path.unshift(c);
  hlNodes = new Set(path);
  hlEdges = new Set(path.slice(1).map((v, i) => path[i] + "->" + v));
  status(path.join(" → "));
}

function arrow(x1, y1, x2, y2, dim) {
  const mx = (x1 + x2) / 2, cy = (y1 + y2) / 2; // always left-to-right
  ctx.strokeStyle = dim ? "#2a4a3e" : "#4c9";
  ctx.fillStyle = dim ? "#2a4a3e" : "#4c9";
  ctx.lineWidth = dim ? 1.5 : 3;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(mx, cy, x2, y2);
  ctx.stroke();
  const a = Math.atan2(y2 - cy, x2 - mx);
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 11 * Math.cos(a - .4), y2 - 11 * Math.sin(a - .4));
  ctx.lineTo(x2 - 11 * Math.cos(a + .4), y2 - 11 * Math.sin(a + .4));
  ctx.fill();
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  ctx.translate(cam.x, cam.y);
  ctx.scale(cam.k, cam.k);
  const dimAll = hlNodes !== null;
  const flt = filtersActive();
  for (const e of G.edges || []) {
    const src = instOf(e.from);
    const dst = src ? instOf(e.to, colOf.get(src)) : null;
    if (!src || !dst) continue;
    const a = pos.get(src), b = pos.get(dst);
    const on = hlEdges && hlEdges.has(edgeKey(e));
    const eDim = (dimAll && !on) || (flt && !(passes(e.from) && passes(e.to)));
    arrow(a.x + W, a.y + (IH + LH) / 2, b.x, b.y + (IH + LH) / 2, eDim);
  }
  const byUrl = new Map(G.nodes.map((n) => [n.url, n]));
  for (const [id, { x, y }] of pos) {
    const u = idToUrl.get(id);
    const dim = (dimAll && !hlNodes.has(u)) || (flt && !passes(u));
    ctx.globalAlpha = dim ? .25 : 1;
    const im = imgs.get(u);
    ctx.fillStyle = "#222";
    ctx.fillRect(x, y, W, IH + LH);
    if (im) {
      const s = Math.max(W / im.width, IH / im.height);
      const dw = im.width * s, dh = im.height * s;
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, W, IH); ctx.clip();
      ctx.drawImage(im, x + (W - dw) / 2, y + (IH - dh) / 2, dw, dh);
      ctx.restore();
    } else {
      ctx.fillStyle = "#555"; ctx.font = "14px system-ui";
      ctx.fillText("no image", x + 10, y + 24);
    }
    ctx.fillStyle = sel.includes(u) ? "#0a4" : "#000";
    ctx.fillRect(x, y + IH, W, LH);
    ctx.fillStyle = "#eee"; ctx.font = "13px system-ui";
    ctx.fillText(u.length > 34 ? u.slice(0, 33) + "…" : u, x + 8, y + IH + 20);
    ctx.globalAlpha = 1;
  }
}

function loadImgs() {
  const byUrl = new Map(G.nodes.map((n) => [n.url, n]));
  const urls = [...new Set(idToUrl.values())];
  return Promise.all(urls.map((u) => new Promise((res) => {
    const shot = ((byUrl.get(u) || {}).screenshot || "").split("/").pop();
    if (!shot) return res();
    const im = new Image();
    im.onload = () => { imgs.set(u, im); res(); };
    im.onerror = () => res();
    im.src = "../shots/" + shot;
  })));
}

// interactions
let drag = null;
cv.addEventListener("mousedown", (e) => {
  const w = toWorld(e.clientX, e.clientY);
  const u = nodeAt(w.x, w.y);
  drag = { u, sx: e.clientX, sy: e.clientY, moved: false, ox: 0, oy: 0 };
  if (u) { const p = pos.get(u); drag.ox = p.x - w.x; drag.oy = p.y - w.y; }
  cv.style.cursor = "grabbing";
});
cv.addEventListener("mousemove", (e) => {
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4) drag.moved = true;
  const w = toWorld(e.clientX, e.clientY);
  if (drag.u && drag.moved) {
    pos.set(drag.u, { x: w.x + drag.ox, y: w.y + drag.oy });
    draw();
  } else if (!drag.u && drag.moved) {
    cam.x += e.movementX; cam.y += e.movementY;
    draw();
  }
});
cv.addEventListener("mouseup", (e) => {
  cv.style.cursor = "grab";
  if (drag && !drag.moved) {
    const w = toWorld(e.clientX, e.clientY);
    const hit = nodeAt(w.x, w.y);
    const u = hit ? idToUrl.get(hit) : null;
    if (!u) { sel = []; hlNodes = null; hlEdges = null; hideCalls(); applyFilters(); return; }
    else if (sel.length === 0) { sel = [u]; showCalls(u); status(`from ${u} — click a target`); }
    else if (sel[0] === u) { sel = []; hlNodes = null; hlEdges = null; hideCalls(); }
    else { sel = [sel[0], u]; trace(sel[0], u); showCalls(u); }
    draw();
  }
  drag = null;
});
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k2 = Math.min(3, Math.max(.15, cam.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  cam.x = mx - ((mx - cam.x) / cam.k) * k2;
  cam.y = my - ((my - cam.y) / cam.k) * k2;
  cam.k = k2;
  draw();
}, { passive: false });
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    sel = []; hlNodes = null; hlEdges = null;
    document.getElementById("f-endpoint").value = "";
    document.getElementById("f-auth").value = "";
    fEndpoint = ""; fAuth = "";
    hideCalls(); applyFilters();
  }
});
window.addEventListener("resize", resize);
document.getElementById("fit").onclick = fit;
document.getElementById("f-endpoint").onchange = (e) => { fEndpoint = e.target.value; applyFilters(); };
document.getElementById("f-auth").onchange = (e) => { fAuth = e.target.value; applyFilters(); };

(async () => {
  const g = await load();
  if (!g) {
    status("no graph data — pick sidemap.json:");
    const pick = document.getElementById("pick");
    pick.hidden = false;
    pick.onchange = async () => start(JSON.parse(await pick.files[0].text()));
    return;
  }
  start(g);
})();

async function start(g) {
  G = g;
  pos = layout(g);
  const eps = [...new Set(g.nodes.flatMap((n) => (n.http || []).map(epKey)))].sort();
  const fEp = document.getElementById("f-endpoint");
  for (const ep of eps) {
    const o = document.createElement("option");
    o.value = ep; o.textContent = ep;
    fEp.appendChild(o);
  }
  status(`${g.nodes.length} nodes (+${ghostCount} repeats), ${(g.edges || []).length} edges`);
  resize();
  fit();
  await loadImgs();
  draw();
}
</script>
</body>
</html>
